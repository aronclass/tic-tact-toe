<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin-bottom: 20px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cell:hover {
            background-color: #f0f0f0;
        }
        .status {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 36px;
            text-align: center;
        }
        .restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .restart-btn:hover {
            background-color: #45a049;
        }
        .player-x {
            color: #e74c3c;
        }
        .player-o {
            color: #3498db;
        }
        @media (max-width: 600px) {
            .board {
                grid-template-columns: repeat(3, 80px);
                grid-template-rows: repeat(3, 80px);
            }
            .cell {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="game-container">
        <div class="status">You are X. Your turn.</div>
        <div class="board" id="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button class="restart-btn" id="restart-button">Restart Game</button>
    </div>

    <script>
        // Wait for the DOM to be fully loaded
        window.addEventListener('DOMContentLoaded', function() {
            // Game elements
            const cells = document.querySelectorAll('.cell');
            const statusDisplay = document.querySelector('.status');
            const restartButton = document.getElementById('restart-button');
            
            // Game variables
            let gameActive = true;
            let currentPlayer = 'X';
            let gameState = ['', '', '', '', '', '', '', '', ''];
            
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];
            
            // Handle cell click
            function handleCellClick(event) {
                const clickedCell = event.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));
                
                // Check if cell is already played or game is inactive
                if (gameState[clickedCellIndex] !== '' || !gameActive) {
                    return;
                }
                
                // Update game state and UI
                gameState[clickedCellIndex] = currentPlayer;
                clickedCell.textContent = currentPlayer;
                clickedCell.classList.add(`player-${currentPlayer.toLowerCase()}`);
                
                // Check for win or draw
                checkGameResult();
                
                // Computer's turn
                if (gameActive) {
                    currentPlayer = 'O';
                    statusDisplay.textContent = 'Computer thinking...';
                    
                    // Add a small delay for better UX
                    setTimeout(function() {
                        computerMove();
                    }, 600);
                }
            }
            
            // Computer's move logic
            function computerMove() {
                if (!gameActive) return;
                
                // Try to win
                const winMove = findWinningMove('O');
                if (winMove !== -1) {
                    makeMove(winMove);
                    return;
                }
                
                // Try to block player
                const blockMove = findWinningMove('X');
                if (blockMove !== -1) {
                    makeMove(blockMove);
                    return;
                }
                
                // Take center if available
                if (gameState[4] === '') {
                    makeMove(4);
                    return;
                }
                
                // Take a corner if available
                const corners = [0, 2, 6, 8];
                const availableCorners = corners.filter(corner => gameState[corner] === '');
                if (availableCorners.length > 0) {
                    const randomCorner = availableCorners[Math.floor(Math.random() * availableCorners.length)];
                    makeMove(randomCorner);
                    return;
                }
                
                // Take any available side
                const sides = [1, 3, 5, 7];
                const availableSides = sides.filter(side => gameState[side] === '');
                if (availableSides.length > 0) {
                    const randomSide = availableSides[Math.floor(Math.random() * availableSides.length)];
                    makeMove(randomSide);
                    return;
                }
            }
            
            // Make a move at the specified index
            function makeMove(index) {
                gameState[index] = 'O';
                cells[index].textContent = 'O';
                cells[index].classList.add('player-o');
                checkGameResult();
                if (gameActive) {
                    currentPlayer = 'X';
                    statusDisplay.textContent = 'Your turn (X)';
                }
            }
            
            // Find a winning move for the specified player
            function findWinningMove(player) {
                for (let i = 0; i < winningConditions.length; i++) {
                    const [a, b, c] = winningConditions[i];
                    
                    // Check if we can win in this condition
                    if (gameState[a] === player && gameState[b] === player && gameState[c] === '') {
                        return c;
                    }
                    if (gameState[a] === player && gameState[c] === player && gameState[b] === '') {
                        return b;
                    }
                    if (gameState[b] === player && gameState[c] === player && gameState[a] === '') {
                        return a;
                    }
                }
                return -1;
            }
            
            // Check if game is won or drawn
            function checkGameResult() {
                let roundWon = false;
                
                // Check for win conditions
                for (let i = 0; i < winningConditions.length; i++) {
                    const [a, b, c] = winningConditions[i];
                    const condition = gameState[a] === gameState[b] && 
                                      gameState[b] === gameState[c] && 
                                      gameState[a] !== '';
                    
                    if (condition) {
                        roundWon = true;
                        highlightWinningCells([a, b, c]);
                        break;
                    }
                }
                
                // Handle win
                if (roundWon) {
                    statusDisplay.textContent = currentPlayer === 'X' ? 
                        'You won!' : 'Computer won!';
                    gameActive = false;
                    return;
                }
                
                // Check for draw
                const roundDraw = !gameState.includes('');
                if (roundDraw) {
                    statusDisplay.textContent = 'Game ended in a draw!';
                    gameActive = false;
                    return;
                }
            }
            
            // Highlight winning cells
            function highlightWinningCells(winningCells) {
                winningCells.forEach(index => {
                    cells[index].style.backgroundColor = '#e6ffe6';
                    cells[index].style.borderColor = '#4CAF50';
                });
            }
            
            // Restart the game
            function restartGame() {
                gameActive = true;
                currentPlayer = 'X';
                gameState = ['', '', '', '', '', '', '', '', ''];
                statusDisplay.textContent = 'You are X. Your turn.';
                
                cells.forEach(cell => {
                    cell.textContent = '';
                    cell.classList.remove('player-x', 'player-o');
                    cell.style.backgroundColor = 'white';
                    cell.style.borderColor = '#333';
                });
            }
            
            // Add event listeners
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            
            restartButton.addEventListener('click', restartGame);
        });
    </script>
</body>
</html>
